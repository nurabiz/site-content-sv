Query:
    type: object
    config:
        fields:
            documents:
                type: '[Document!]!'
                resolve: '@=service("NuraBiz\\SiteContent\\GraphQl\\DocumentQueries").documents()'
            documentsList:
                type: '[Document!]!'
                resolve: '@=service("NuraBiz\\SiteContent\\GraphQl\\DocumentQueries").documents()'
            documentTypes:
                type: '[DocumentType!]!'
                resolve: '@=service("NuraBiz\\SiteContent\\GraphQl\\DocumentQueries").documentTypes()'
            documentLocales:
                type: '[LocaleCode!]!'
                resolve: '@=service("NuraBiz\\SiteContent\\GraphQl\\DocumentQueries").documentLocales()'
            documentContents:
                type: '[DocumentContent!]'
                args:
                    document_id: { type: 'Int!' }
                resolve: '@=service("NuraBiz\\SiteContent\\GraphQl\\DocumentQueries").documentContents(args["document_id"])'
            documentContent:
                type: DocumentContent
                args:
                    document_id: { type: 'Int!' }
                    locale: { type: 'LocaleCode!' }
                resolve: '@=service("NuraBiz\\SiteContent\\GraphQl\\DocumentQueries").documentContent(args["document_id"], args["locale"])'
            news:
                type: News
                args:
                    id: { type: 'Int!' }
                resolve: '@=service("NuraBiz\\SiteContent\\GraphQl\\NewsQueries").find(args["id"])'
            newsLocalized:
                type: News
                args:
                    id: { type: 'Int!' }
                    locale: { type: 'LocaleCode!' }
                resolve: '@=service("NuraBiz\\SiteContent\\GraphQl\\NewsQueries").find(args["id"], args["locale"])'
            newsList:
                type: '[News!]!'
                args:
                    limit: { type: 'Int!', defaultValue: 20 }
                    offset: { type: 'Int!', defaultValue: 0 }
                    valid: { type: Boolean, defaultValue: null }
                    client_type: { type: Int, defaultValue: null }
                resolve: '@=service("NuraBiz\\SiteContent\\GraphQl\\NewsQueries").list(args["limit"], args["offset"], args["valid"], args["client_type"])'

Document:
    type: object
    config:
        fields:
            id: { type: 'Int!' }
            type_id: { type: 'Int!' }
            type: { type: DocumentType }
            slug: { type: 'String!' }
            created_at: { type: 'DateTime!' }
            updated_at: { type: 'DateTime!' }

DocumentType:
    type: enum
    config:
        enumClass: NuraBiz\SiteContent\GraphQl\DocumentType

DateTime:
    type: custom-scalar
    config:
        description: 'ISO 8601 local date and time to second precision, without a time zone.'
        serialize: NuraBiz\SiteContent\GraphQl\DateTimeScalar::serialize

LocaleCode:
    type: custom-scalar
    config:
        description: 'Two-letter document locale code.'
        serialize: NuraBiz\SiteContent\GraphQl\LocaleCodeScalar::serialize
        parseValue: NuraBiz\SiteContent\GraphQl\LocaleCodeScalar::parseValue
        parseLiteral: NuraBiz\SiteContent\GraphQl\LocaleCodeScalar::parseLiteral

DocumentContent:
    type: object
    config:
        fields:
            id: { type: 'Int!' }
            doc_id: { type: 'Int!' }
            locale: { type: 'LocaleCode!' }
            doc_content: { type: 'String!' }
            created_at: { type: 'DateTime!' }
            updated_at: { type: 'DateTime!' }
            updated_by: { type: 'Int!' }
