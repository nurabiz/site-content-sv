docs_list:
    path: /docs
    controller: NuraBiz\SiteContent\Controller\DocumentsController::list
    methods: GET
    defaults:
        _format: json

docs_types:
    path: /docs/types
    controller: NuraBiz\SiteContent\Controller\DocumentsController::types
    methods: GET
    defaults:
        _format: json

docs_locales:
    path: /docs/locales
    controller: NuraBiz\SiteContent\Controller\DocumentsController::locales
    methods: GET
    defaults:
        _format: json

doc_get_by_translit:
    path: /docs/{translit}/{locale}
    controller: NuraBiz\SiteContent\Controller\DocumentsController::getByTranslit
    methods: GET
    defaults:
        _format: json
    requirements:
        locale: '[A-Za-z]{2}'

doc_create:
    path: /docs
    controller: NuraBiz\SiteContent\Controller\DocumentsController::create
    methods: POST
    defaults:
        _format: json

doc_get:
    path: /docs/{id}
    controller: NuraBiz\SiteContent\Controller\DocumentsController::get
    methods: GET
    defaults:
        _format: json
    requirements:
        id: '[0-9]+'

doc_update:
    path: /docs/{id}
    controller: NuraBiz\SiteContent\Controller\DocumentsController::update
    methods: PUT
    defaults:
        _format: json
    requirements:
        id: '[0-9]+'

doc_delete:
    path: /docs/{id}
    controller: NuraBiz\SiteContent\Controller\DocumentsController::delete
    methods: DELETE
    defaults:
        _format: json
    requirements:
        id: '[0-9]+'
