doc_locales_list:
    path: /docs/{docId}/locales
    controller: NuraBiz\SiteContent\Controller\DocumentLocalesController::list
    methods: GET
    defaults:
        _format: json
    requirements:
        docId: '[0-9]+'

doc_locales_create:
    path: /docs/{docId}/locales
    controller: NuraBiz\SiteContent\Controller\DocumentLocalesController::create
    methods: POST
    defaults:
        _format: json
    requirements:
        docId: '[0-9]+'

doc_locales_delete_all:
    path: /docs/{docId}/locales
    controller: NuraBiz\SiteContent\Controller\DocumentLocalesController::deleteAll
    methods: DELETE
    defaults:
        _format: json
    requirements:
        docId: '[0-9]+'

doc_locales_update_by_language:
    path: /docs/{docId}/locales/{langId}
    controller: NuraBiz\SiteContent\Controller\DocumentLocalesController::updateByLanguage
    methods: PUT
    defaults:
        _format: json
    requirements:
        docId: '[0-9]+'
        langId: '[A-Za-z]{2}'

doc_locales_delete_by_language:
    path: /docs/{docId}/locales/{langId}
    controller: NuraBiz\SiteContent\Controller\DocumentLocalesController::deleteByLanguage
    methods: DELETE
    defaults:
        _format: json
    requirements:
        docId: '[0-9]+'
        langId: '[A-Za-z]{2}'

doc_locales_get:
    path: /docs/{docId}/locales/{id}
    controller: NuraBiz\SiteContent\Controller\DocumentLocalesController::get
    methods: GET
    defaults:
        _format: json
    requirements:
        docId: '[0-9]+'
        id: '[0-9]+'

doc_locales_update:
    path: /docs/{docId}/locales/{id}
    controller: NuraBiz\SiteContent\Controller\DocumentLocalesController::update
    methods: PUT
    defaults:
        _format: json
    requirements:
        docId: '[0-9]+'
        id: '[0-9]+'

doc_locales_delete:
    path: /docs/{docId}/locales/{id}
    controller: NuraBiz\SiteContent\Controller\DocumentLocalesController::delete
    methods: DELETE
    defaults:
        _format: json
    requirements:
        docId: '[0-9]+'
        id: '[0-9]+'
